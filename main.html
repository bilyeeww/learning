<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ABC Fun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#3FA9F5;
    --sky-deep:#2C86D6;
    --sun:#FFCA3A;
    --coral:#FF6F61;
    --mint:#3DDC97;
    --cream:#FFF8EC;
    --ink:#2B2540;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Nunito',sans-serif;
    background:
      radial-gradient(circle at 15% 10%, #FFEFD1 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #D8F3FF 0%, transparent 45%),
      var(--cream);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-user-select:none;
    user-select:none;
  }
  #app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding:20px 18px 40px;}

  .view{display:none;flex-direction:column;align-items:center;animation:fadeIn .35s ease;}
  .view.active{display:flex;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  h1,h2{font-family:'Baloo 2',sans-serif;margin:6px 0 2px;text-align:center;}
  h1{font-size:2rem;color:var(--sky-deep);}
  h2{font-size:1.5rem;color:var(--sky-deep);}
  .subtitle{margin:0 0 18px;color:#7A7390;font-weight:700;font-size:1.05rem;}

  button{font-family:'Baloo 2',sans-serif;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  button:active{transform:scale(.95);}
  button:disabled{opacity:.5;pointer-events:none;}

  .back-btn{
    align-self:flex-start;background:var(--card);color:var(--sky-deep);
    font-size:1.05rem;font-weight:700;padding:10px 18px;border-radius:999px;
    box-shadow:0 3px 0 #E3DFF2;margin-bottom:10px;
  }

  /* ---------- Home ---------- */
  .mascot-wrap{width:150px;height:150px;margin:6px auto 4px;}
  .category-list{width:100%;display:flex;flex-direction:column;gap:16px;margin-top:22px;}
  .cat-btn{
    position:relative;width:100%;padding:22px 20px;font-size:1.4rem;font-weight:700;color:#fff;
    border-radius:26px;background:linear-gradient(135deg,var(--sky),var(--sky-deep));
    box-shadow:0 6px 0 #1F6BA8;display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .cat-btn.disabled{background:linear-gradient(135deg,#CFC9DE,#B7AFCF);box-shadow:0 6px 0 #9C93B8;color:#524A6B;}
  .soon{position:absolute;top:-10px;right:14px;background:var(--coral);color:#fff;font-size:.65rem;padding:4px 9px;border-radius:999px;box-shadow:0 2px 0 #C64A3E;}

  /* ---------- Letter grid ---------- */
  .grid{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:8px;}
  .letter-btn{aspect-ratio:1/1;border-radius:20px;font-size:1.5rem;font-weight:700;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;box-shadow:0 5px 0 rgba(0,0,0,.18);}
  .letter-btn small{font-size:1rem;font-weight:600;opacity:.9;}

  /* ---------- Letter detail ---------- */
  .mascot-small{width:80px;height:80px;margin-bottom:2px;}
  .case-label{
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1.05rem;color:var(--sky-deep);
    background:#EAF5FF;padding:6px 18px;border-radius:999px;margin-bottom:6px;
  }
  .letter-stage{
    position:relative;width:100%;background:var(--card);border-radius:28px;box-shadow:0 6px 0 #E3DFF2;
    padding:10px 14px;display:flex;align-items:center;justify-content:center;margin:8px 0 22px;
  }
  #strokeSvg{width:56%;max-width:210px;}
  .guide-path{fill:none;stroke:#E4E1F0;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;}
  .draw-path{fill:none;stroke:var(--coral);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;}
  #pencilTip{fill:var(--coral);stroke:#fff;stroke-width:2;opacity:0;}

  .action-row{width:100%;display:flex;flex-direction:column;gap:14px;}
  .action-btn{width:100%;padding:18px;font-size:1.2rem;font-weight:700;color:#fff;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:10px;}
  #writeBtn{background:linear-gradient(135deg,var(--mint),#22B685);box-shadow:0 6px 0 #189968;}
  #soundBtn{background:linear-gradient(135deg,var(--sun),#F0A400);box-shadow:0 6px 0 #C68300;color:#4A3300;}
  #celebrateBtn{background:linear-gradient(135deg,#C58BF2,#8E5FD1);box-shadow:0 6px 0 #6B3FA8;}

  .wave{animation:wave 1.8s ease-in-out infinite;transform-origin:70% 70%;}
  @keyframes wave{0%,100%{transform:rotate(0deg);}25%{transform:rotate(14deg);}75%{transform:rotate(-6deg);}}
  .bob{animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

  /* ---------- Mascot tap interactions ---------- */
  .mascot{position:relative;cursor:pointer;}
  .mascot.anim-wave{animation:mascotWave .9s ease;}
  @keyframes mascotWave{
    0%{transform:rotate(0deg) scale(1);}
    15%{transform:rotate(-9deg) scale(1.05);}
    35%{transform:rotate(11deg);}
    55%{transform:rotate(-7deg);}
    75%{transform:rotate(5deg);}
    100%{transform:rotate(0deg) scale(1);}
  }
  .mascot.anim-spin{animation:mascotSpin .8s cubic-bezier(.34,1.56,.64,1);}
  @keyframes mascotSpin{
    0%{transform:translateY(0) rotate(0deg) scale(1);}
    30%{transform:translateY(-22px) rotate(180deg) scale(1.12);}
    60%{transform:translateY(-26px) rotate(360deg) scale(1.12);}
    100%{transform:translateY(0) rotate(360deg) scale(1);}
  }
  .mascot.anim-wiggle{animation:mascotWiggle .7s ease-in-out;}
  @keyframes mascotWiggle{
    0%,100%{transform:translateX(0) rotate(0deg);}
    20%{transform:translateX(-9px) rotate(-7deg);}
    40%{transform:translateX(9px) rotate(7deg);}
    60%{transform:translateX(-7px) rotate(-5deg);}
    80%{transform:translateX(7px) rotate(5deg);}
  }

  .speech-bubble{
    position:absolute;top:0;left:50%;
    transform:translate(-50%,-100%) scale(.5);
    background:#fff;color:var(--ink);font-family:'Baloo 2',sans-serif;font-weight:700;font-size:.95rem;
    padding:7px 14px;border-radius:16px;box-shadow:0 3px 0 #E3DFF2;white-space:nowrap;
    opacity:0;pointer-events:none;transition:all .22s ease;z-index:6;
  }
  .speech-bubble::after{
    content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
    border-width:6px 6px 0;border-style:solid;border-color:#fff transparent transparent;
  }
  .speech-bubble.show{opacity:1;transform:translate(-50%,-110%) scale(1);}

  .sparkle{position:absolute;font-size:1.1rem;opacity:0;pointer-events:none;animation:sparklePop .7s ease forwards;z-index:5;}
  @keyframes sparklePop{
    0%{opacity:0;transform:scale(.3) translateY(0);}
    40%{opacity:1;transform:scale(1.2) translateY(-8px);}
    100%{opacity:0;transform:scale(.8) translateY(-22px);}
  }

  /* ---------- Celebration modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(43,37,64,.55);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:50;}
  .modal-overlay.show{opacity:1;pointer-events:auto;}
  .modal-card{
    background:#fff;border-radius:28px;padding:30px 24px 24px;width:82%;max-width:320px;text-align:center;
    position:relative;overflow:hidden;box-shadow:0 10px 0 #E3DFF2;transform:scale(.75);transition:transform .28s cubic-bezier(.34,1.56,.64,1);
  }
  .modal-overlay.show .modal-card{transform:scale(1);}
  .confetti-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .confetti-piece{position:absolute;top:-30px;font-size:1.4rem;animation:confettiFall 1.6s ease-in forwards;}
  @keyframes confettiFall{
    0%{transform:translateY(-20px) rotate(0deg);opacity:1;}
    100%{transform:translateY(260px) rotate(360deg);opacity:0;}
  }
  .thumb-bounce{width:96px;height:96px;margin:0 auto 6px;animation:thumbPop .6s cubic-bezier(.34,1.56,.64,1);}
  @keyframes thumbPop{0%{transform:scale(0) rotate(-20deg);}60%{transform:scale(1.15) rotate(8deg);}100%{transform:scale(1) rotate(0deg);}}
  .modal-card h2{color:var(--sky-deep);font-size:1.6rem;margin:4px 0 18px;}
  .close-btn{background:linear-gradient(135deg,var(--sky),var(--sky-deep));box-shadow:0 6px 0 #1F6BA8;}
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <section id="view-home" class="view active">
    <div class="mascot-wrap mascot bob">
      <svg viewBox="0 0 200 200" width="100%" height="100%">
        <ellipse cx="100" cy="185" rx="55" ry="10" fill="#000" opacity=".08"/>
        <rect x="70" y="120" width="60" height="55" rx="18" fill="#3FA9F5"/>
        <circle cx="55" cy="140" r="14" fill="#3FA9F5"/>
        <g class="wave">
          <circle cx="150" cy="120" r="14" fill="#3FA9F5"/>
          <rect x="142" y="95" width="16" height="35" rx="8" fill="#3FA9F5"/>
        </g>
        <circle cx="100" cy="80" r="52" fill="#FFFFFF" stroke="#3FA9F5" stroke-width="8"/>
        <circle cx="100" cy="34" r="8" fill="#FFCA3A"/>
        <rect x="97" y="40" width="6" height="16" fill="#FFCA3A"/>
        <circle cx="80" cy="82" r="11" fill="#2B2540"/>
        <circle cx="120" cy="82" r="11" fill="#2B2540"/>
        <circle cx="83" cy="78" r="3.5" fill="#fff"/>
        <circle cx="123" cy="78" r="3.5" fill="#fff"/>
        <path d="M82 102 Q100 116 118 102" stroke="#2B2540" stroke-width="5" fill="none" stroke-linecap="round"/>
        <circle cx="65" cy="95" r="7" fill="#FF6F61" opacity=".6"/>
        <circle cx="135" cy="95" r="7" fill="#FF6F61" opacity=".6"/>
      </svg>
    </div>
    <h1>Let's Learn!</h1>
    <p class="subtitle">Pick something fun to play</p>
    <div class="category-list">
      <button class="cat-btn" data-cat="alpha">🔤 Alphabet</button>
      <button class="cat-btn disabled" data-cat="others">✨ Others<span class="soon">Soon!</span></button>
    </div>
  </section>

  <!-- ALPHABET GRID -->
  <section id="view-grid" class="view">
    <button class="back-btn" data-back="home">⬅ Back</button>
    <h2>Pick a Letter</h2>
    <div class="grid" id="letterGrid"></div>
  </section>

  <!-- LETTER DETAIL -->
  <section id="view-letter" class="view">
    <button class="back-btn" data-back="grid">⬅ Back</button>
    <div class="mascot-small mascot bob">
      <svg viewBox="0 0 200 200" width="100%" height="100%">
        <circle cx="100" cy="80" r="52" fill="#FFFFFF" stroke="#3FA9F5" stroke-width="8"/>
        <circle cx="100" cy="34" r="8" fill="#FFCA3A"/>
        <rect x="97" y="40" width="6" height="16" fill="#FFCA3A"/>
        <circle cx="80" cy="82" r="11" fill="#2B2540"/>
        <circle cx="120" cy="82" r="11" fill="#2B2540"/>
        <circle cx="83" cy="78" r="3.5" fill="#fff"/>
        <circle cx="123" cy="78" r="3.5" fill="#fff"/>
        <path d="M82 102 Q100 116 118 102" stroke="#2B2540" stroke-width="5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="case-label" id="caseLabel">Capital Letter</div>
    <div class="letter-stage">
      <svg id="strokeSvg" viewBox="0 0 100 132">
        <g id="guideGroup"></g>
        <g id="drawGroup"></g>
        <circle id="pencilTip" r="6" cx="0" cy="0"></circle>
      </svg>
    </div>
    <div class="action-row">
      <button id="writeBtn" class="action-btn">✏️ Watch It Write</button>
      <button id="soundBtn" class="action-btn">🔊 Hear It</button>
      <button id="celebrateBtn" class="action-btn">🌟 Great Job!</button>
    </div>
  </section>

</div>

<!-- CELEBRATION MODAL -->
<div id="congratsModal" class="modal-overlay">
  <div class="modal-card">
    <div class="confetti-layer" id="confettiLayer"></div>
    <div class="thumb-bounce">
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <circle cx="50" cy="50" r="48" fill="#FFF3D6"/>
        <path d="M35 45 L35 82 L28 82 Q22 82 22 76 L22 51 Q22 45 28 45 Z" fill="#FFCA3A"/>
        <path d="M35 45 L48 18 Q52 10 58 14 Q63 17 60 25 L55 40 L72 40 Q80 40 78 48 L72 76 Q70 82 63 82 L35 82 Z" fill="#FF6F61"/>
      </svg>
    </div>
    <h2>Great Job! 🎉</h2>
    <button id="closeModalBtn" class="action-btn close-btn">✔️ Close</button>
  </div>
</div>

<script>
  /* ---------------- View switching ---------------- */
  const views = {
    home: document.getElementById('view-home'),
    grid: document.getElementById('view-grid'),
    letter: document.getElementById('view-letter'),
  };
  function showView(name){
    Object.values(views).forEach(v => v.classList.remove('active'));
    views[name].classList.add('active');
  }

  const tileColors = ['#3FA9F5','#FF6F61','#3DDC97','#FFCA3A','#B47EEA'];
  const letterGrid = document.getElementById('letterGrid');
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  letters.forEach((L, i) => {
    const btn = document.createElement('button');
    btn.className = 'letter-btn';
    btn.style.background = tileColors[i % tileColors.length];
    btn.innerHTML = `${L}<small>${L.toLowerCase()}</small>`;
    btn.addEventListener('click', () => openLetter(L));
    letterGrid.appendChild(btn);
  });

  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.classList.contains('disabled')) return;
      if (btn.dataset.cat === 'alpha') showView('grid');
    });
  });
  document.querySelectorAll('.back-btn').forEach(btn => {
    btn.addEventListener('click', () => showView(btn.dataset.back));
  });

  /* ---------------- Mascot tap interactions ---------------- */
  const MASCOT_ANIMATIONS = [
    { cls: 'anim-wave',   bubble: 'Hi friend!', speak: 'Hi friend!', duration: 900 },
    { cls: 'anim-spin',   bubble: 'Wheee!',      speak: 'Whee!',      duration: 800 },
    { cls: 'anim-wiggle', bubble: 'Hehe!',       speak: 'Hehe!',      duration: 700, sparkles: true },
  ];

  function showBubble(container, text){
    const bubble = document.createElement('div');
    bubble.className = 'speech-bubble';
    bubble.textContent = text;
    container.appendChild(bubble);
    requestAnimationFrame(() => bubble.classList.add('show'));
    setTimeout(() => {
      bubble.classList.remove('show');
      setTimeout(() => bubble.remove(), 220);
    }, 1100);
  }

  function spawnSparkles(container){
    const emojis = ['✨','⭐','🌟'];
    for (let i = 0; i < 5; i++){
      const s = document.createElement('span');
      s.className = 'sparkle';
      s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      s.style.left = (10 + Math.random() * 80) + '%';
      s.style.top = (10 + Math.random() * 60) + '%';
      s.style.animationDelay = (Math.random() * 0.15) + 's';
      container.appendChild(s);
      setTimeout(() => s.remove(), 800);
    }
  }

  function playMascotChime(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(660, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    }catch(e){}
  }

  function triggerMascotAnimation(el){
    if (el.dataset.animating === '1') return; // ignore taps mid-animation
    el.dataset.animating = '1';

    const pick = MASCOT_ANIMATIONS[Math.floor(Math.random() * MASCOT_ANIMATIONS.length)];
    el.classList.remove('bob');
    el.classList.add(pick.cls);
    showBubble(el, pick.bubble);
    playMascotChime();
    if (pick.sparkles) spawnSparkles(el);

    setTimeout(() => {
      el.classList.remove(pick.cls);
      el.classList.add('bob');
      el.dataset.animating = '0';
    }, pick.duration + 50);
  }

  document.querySelectorAll('.mascot').forEach(el => {
    el.addEventListener('click', () => triggerMascotAnimation(el));
  });

  /* ---------------- Accurate stroke-order paths ---------------- */
  /* Coordinate box: x 0-100, y 5(cap top)/45(x-height top)-105(baseline)-125(descenders) */
  const UPPER_STROKES = {
    A: ["M50,5 L15,105", "M50,5 L85,105", "M28,65 L72,65"],
    B: ["M20,5 L20,105", "M20,5 Q65,5 65,27 Q65,50 20,50", "M20,50 Q70,50 70,77 Q70,105 20,105"],
    C: ["M82,20 Q80,2 50,2 Q15,2 15,52 Q15,102 50,102 Q80,102 82,84"],
    D: ["M20,5 L20,105", "M20,5 Q80,5 80,55 Q80,105 20,105"],
    E: ["M20,5 L20,105", "M20,5 L80,5", "M20,55 L65,55", "M20,105 L80,105"],
    F: ["M20,5 L20,105", "M20,5 L80,5", "M20,55 L65,55"],
    G: ["M82,20 Q80,2 50,2 Q15,2 15,52 Q15,102 50,102 Q80,102 82,80 L82,55 L58,55"],
    H: ["M20,5 L20,105", "M80,5 L80,105", "M20,55 L80,55"],
    I: ["M50,5 L50,105"],
    J: ["M65,5 L65,75 Q65,105 35,105 Q18,105 18,85"],
    K: ["M20,5 L20,105", "M78,5 L20,55", "M20,55 L78,105"],
    L: ["M25,5 L25,105", "M25,105 L78,105"],
    M: ["M15,105 L15,5", "M15,5 L50,60", "M50,60 L85,5", "M85,5 L85,105"],
    N: ["M20,105 L20,5", "M20,5 L80,105", "M80,105 L80,5"],
    O: ["M50,2 C80,2 88,27 88,52 C88,77 80,102 50,102 C20,102 12,77 12,52 C12,27 20,2 50,2"],
    P: ["M20,5 L20,105", "M20,5 Q72,5 72,28 Q72,52 20,52"],
    Q: ["M50,2 C80,2 88,27 88,52 C88,77 80,102 50,102 C20,102 12,77 12,52 C12,27 20,2 50,2", "M58,72 L88,105"],
    R: ["M20,5 L20,105", "M20,5 Q72,5 72,28 Q72,52 20,52", "M42,52 L80,105"],
    S: ["M78,22 Q78,3 47,3 Q17,3 17,26 Q17,49 50,50 Q85,51 85,76 Q85,102 53,102 Q22,102 22,80"],
    T: ["M15,5 L85,5", "M50,5 L50,105"],
    U: ["M20,5 L20,72 Q20,105 50,105 Q80,105 80,72 L80,5"],
    V: ["M15,5 L50,105", "M85,5 L50,105"],
    W: ["M8,5 L28,105", "M28,105 L50,40", "M50,40 L72,105", "M72,105 L92,5"],
    X: ["M15,5 L85,105", "M85,5 L15,105"],
    Y: ["M15,5 L50,55", "M85,5 L50,55", "M50,55 L50,105"],
    Z: ["M15,5 L85,5", "M85,5 L15,105", "M15,105 L85,105"],
  };

  const LOWER_STROKES = {
    a: ["M68,50 Q68,45 53,45 Q38,45 38,75 Q38,105 53,105 Q68,105 68,90", "M68,45 L68,105"],
    b: ["M30,5 L30,105", "M30,60 Q72,60 72,82 Q72,105 30,105"],
    c: ["M72,55 Q68,45 50,45 Q30,45 30,75 Q30,105 50,105 Q68,105 72,95"],
    d: ["M72,5 L72,105", "M72,55 Q30,55 30,80 Q30,105 72,105"],
    e: ["M32,78 L70,78 Q70,45 48,45 Q28,46 28,76 Q28,106 50,105 Q65,104 70,93"],
    f: ["M62,10 Q45,5 42,20 L42,105", "M28,50 L58,50"],
    g: ["M68,50 Q68,45 53,45 Q38,45 38,72 Q38,99 53,99 Q68,99 68,75", "M68,50 L68,118 Q68,128 55,128 Q45,128 42,120"],
    h: ["M28,5 L28,105", "M28,60 Q28,45 45,45 Q62,45 62,60 L62,105"],
    i: ["M50,45 L50,105", "M48,18 A2,2 0 1,0 52,18 A2,2 0 1,0 48,18"],
    j: ["M50,45 L50,118 Q50,128 38,128 Q30,128 28,120", "M52,18 A2,2 0 1,0 48,18 A2,2 0 1,0 52,18"],
    k: ["M28,5 L28,105", "M62,45 L28,75", "M28,75 L62,105"],
    l: ["M42,5 L42,105"],
    m: ["M22,45 L22,105", "M22,60 Q22,45 37,45 Q52,45 52,60 L52,105", "M52,60 Q52,45 67,45 Q82,45 82,60 L82,105"],
    n: ["M28,45 L28,105", "M28,60 Q28,45 45,45 Q62,45 62,60 L62,105"],
    o: ["M50,45 C65,45 72,58 72,75 C72,92 65,105 50,105 C35,105 28,92 28,75 C28,58 35,45 50,45"],
    p: ["M30,45 L30,125", "M30,45 Q72,45 72,72 Q72,100 30,100"],
    q: ["M70,50 Q70,45 55,45 Q40,45 40,75 Q40,105 55,105 Q70,105 70,90", "M70,45 L70,125"],
    r: ["M32,45 L32,105", "M32,55 Q32,45 45,45 Q58,45 60,50"],
    s: ["M68,55 Q68,45 48,45 Q30,45 30,58 Q30,72 50,74 Q72,76 72,92 Q72,105 50,105 Q32,105 30,95"],
    t: ["M45,15 L45,95 Q45,105 55,105", "M28,45 L62,45"],
    u: ["M30,45 L30,85 Q30,105 50,105 Q68,105 68,85 L68,45"],
    v: ["M28,45 L50,105", "M72,45 L50,105"],
    w: ["M22,45 L34,105", "M34,105 L50,65", "M50,65 L66,105", "M66,105 L78,45"],
    x: ["M28,45 L72,105", "M72,45 L28,105"],
    y: ["M28,45 L50,80", "M72,45 L34,125"],
    z: ["M30,45 L70,45", "M70,45 L30,105", "M30,105 L70,105"],
  };

  const guideGroup = document.getElementById('guideGroup');
  const drawGroup = document.getElementById('drawGroup');
  const pencilTip = document.getElementById('pencilTip');
  const caseLabel = document.getElementById('caseLabel');
  const writeBtn = document.getElementById('writeBtn');
  const soundBtn = document.getElementById('soundBtn');
  const celebrateBtn = document.getElementById('celebrateBtn');

  let currentLetter = 'A';
  let currentCase = 'upper'; // which case is currently displayed / about to be traced
  let drawPaths = [];

  function buildCase(caseType){
    currentCase = caseType;
    const strokes = caseType === 'upper' ? UPPER_STROKES[currentLetter] : LOWER_STROKES[currentLetter.toLowerCase()];
    guideGroup.innerHTML = '';
    drawGroup.innerHTML = '';
    pencilTip.style.opacity = 0;

    drawPaths = strokes.map(d => {
      const guide = document.createElementNS('http://www.w3.org/2000/svg','path');
      guide.setAttribute('d', d);
      guide.setAttribute('class', 'guide-path');
      guideGroup.appendChild(guide);

      const draw = document.createElementNS('http://www.w3.org/2000/svg','path');
      draw.setAttribute('d', d);
      draw.setAttribute('class', 'draw-path');
      drawGroup.appendChild(draw);
      const len = draw.getTotalLength();
      draw.style.strokeDasharray = len;
      draw.style.strokeDashoffset = len;
      return { el: draw, len };
    });

    caseLabel.textContent = caseType === 'upper' ? 'Capital Letter' : 'Small Letter';
  }

  function openLetter(L){
    currentLetter = L;
    buildCase('upper');
    showView('letter');
  }

  function animateStroke(pathObj, duration){
    return new Promise(resolve => {
      const start = performance.now();
      function frame(now){
        const t = Math.min(1, (now - start) / duration);
        pathObj.el.style.strokeDashoffset = pathObj.len * (1 - t);
        const pt = pathObj.el.getPointAtLength(pathObj.len * t);
        pencilTip.setAttribute('cx', pt.x);
        pencilTip.setAttribute('cy', pt.y);
        if (t < 1) requestAnimationFrame(frame);
        else resolve();
      }
      requestAnimationFrame(frame);
    });
  }

  async function playWriteAnimation(){
    writeBtn.disabled = true; soundBtn.disabled = true; celebrateBtn.disabled = true;
    drawPaths.forEach(p => { p.el.style.strokeDashoffset = p.len; });
    pencilTip.style.opacity = 1;
    for (const p of drawPaths){
      await animateStroke(p, 700);
      await new Promise(r => setTimeout(r, 120));
    }
    pencilTip.style.opacity = 0;
    // toggle to the other case, ready (but not animated) for the next click
    buildCase(currentCase === 'upper' ? 'lower' : 'upper');
    writeBtn.disabled = false; soundBtn.disabled = false; celebrateBtn.disabled = false;
  }

  writeBtn.addEventListener('click', playWriteAnimation);

  soundBtn.addEventListener('click', () => {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(currentLetter);
    utter.rate = 0.7; utter.pitch = 1.3; utter.lang = 'en-US';
    speechSynthesis.speak(utter);
  });

  /* ---------------- Celebration modal ---------------- */
  const modal = document.getElementById('congratsModal');
  const confettiLayer = document.getElementById('confettiLayer');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const CONFETTI_EMOJI = ['🎉','⭐','✨','🎊','🌈'];

  function spawnConfetti(){
    confettiLayer.innerHTML = '';
    for (let i = 0; i < 16; i++){
      const span = document.createElement('span');
      span.className = 'confetti-piece';
      span.textContent = CONFETTI_EMOJI[Math.floor(Math.random() * CONFETTI_EMOJI.length)];
      span.style.left = (Math.random() * 90) + '%';
      span.style.animationDelay = (Math.random() * 0.4) + 's';
      span.style.animationDuration = (1.2 + Math.random() * 0.8) + 's';
      confettiLayer.appendChild(span);
    }
  }

  function playChime(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [523.25, 659.25];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.16);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.16 + 0.3);
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + i * 0.16);
        osc.stop(ctx.currentTime + i * 0.16 + 0.3);
      });
    }catch(e){}
  }

  celebrateBtn.addEventListener('click', () => {
    modal.classList.add('show');
    spawnConfetti();
    playChime();
    if ('speechSynthesis' in window){
      speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance('Good job!');
      utter.rate = 0.95; utter.pitch = 1.4; utter.lang = 'en-US';
      setTimeout(() => speechSynthesis.speak(utter), 350);
    }
  });

  closeModalBtn.addEventListener('click', () => {
    modal.classList.remove('show');
    speechSynthesis.cancel();
  });
</script>
</body>
</html>
